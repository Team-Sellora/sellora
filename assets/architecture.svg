goe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Hierarchy, staff, shops, scope</text><rect x="368.0" y="472" width="262" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="388.0" y="504" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Catalog</text><text x="388.0" y="528" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Products, categories, prices</text><rect x="650.0" y="472" width="262" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="670.0" y="504" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Inventory</text><text x="670.0" y="528" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Stock per owner, reservations</text><rect x="932.0" y="472" width="262" height="84" rx="10" fill="#161b22" stroke="#d95926" stroke-width="1.5"/><rect x="933.0" y="473" width="4" height="82" rx="2" fill="#d95926"/><text x="952.0" y="504" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Order</text><text x="952.0" y="528" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Orders, GPS checkout, cash</text><rect x="227.0" y="574" width="262" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="247.0" y="606" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Delivery</text><text x="247.0" y="630" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Jobs, live tracking, returns</text><rect x="509.0" y="574" width="262" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="529.0" y="606" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Notification</text><text x="529.0" y="630" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Email receipts with retries</text><rect x="791.0" y="574" width="262" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="811.0" y="606" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Audit &amp; Reporting</text><text x="811.0" y="630" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Tamper-evident log, reports</text><text x="640.0" y="682" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">Order is the only service that calls others synchronously (Organization, Catalog, Inventory). Everything after that is asynchronous.</text><rect x="64" y="760" width="772" height="92" rx="10" fill="#161b22" stroke="#3987e5" stroke-width="1.5"/><text x="88" y="792" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Apache Kafka</text><text x="212" y="792" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">on Confluent Cloud</text><rect x="88" y="808