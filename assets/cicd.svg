ase</text><text x="656" y="390" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">pull request into main</text><line x1="890" y1="369" x2="918" y2="369" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-m)"/><rect x="922" y="334" width="294" height="70" rx="10" fill="#161b22" stroke="#0ca30c" stroke-width="1.5"/><rect x="923" y="335" width="4" height="68" rx="2" fill="#0ca30c"/><text x="942" y="366" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#e6edf3" text-anchor="start">Production slot</text><text x="942" y="390" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">same checks, own secrets</text><text x="64" y="450" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">Also on: branch protection on main and dev  ·  Dependabot  ·  CodeQL  ·  secrets only in GitHub environments</text></svg>