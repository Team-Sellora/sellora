<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Sellora fraud-proof checkout flow"><title>Sellora fraud-proof checkout flow</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21262d"/></pattern><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3987e5"/></marker><marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d95926"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#199e70"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d03b3b"/></marker></defs><rect width="1280" height="760" rx="16" fill="#0d1117"/><rect width="1280" height="760" rx="16" fill="url(#dots)"/><rect x="0.5" y="0.5" width="1279" height="759" rx="16" fill="none" stroke="#30363d"/><text x="64" y="70" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" text-anchor="start">Fraud-proof cash collection</text><text x="64" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">The core idea of Sellora. A rep cannot change what was collected, because the rep never carries the receipt.</text><rect x="72.0" y="140" width="260" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><circle cx="102.0" cy="172" r="13" fill="#0d1117" stroke="#3987e5" stroke-width="1.5"/><text x="102.0" y="176.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">1</text><text x="126.0" y="177" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Rep opens checkout</text><text x="92.0" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">At the shop, on the phone,</text><text x="92.0" y="239" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">for a cash sale order.</text><line x1="335.0" y1="215" x2="360.0" y2="215" stroke="#3987e5" stroke-width="1.75" marker-end="url(#arr-b)"/><rect x="364.0" y="140" width="260" height="150" rx="10" fill="#161b22" stroke="#3987e5" stroke-width="1.5"/><circle cx="394.0" cy="172" r="13" fill="#0d1117" stroke="#3987e5" stroke-width="1.5"/><text x="394.0" y="176.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">2</text><text x="418.0" y="177" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">GPS check-in</text><text x="384.0" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">Server measures the distance</text><text x="384.0" y="239" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">to the shop. Must be 300 m</text><text x="384.0" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">or less. Fix under 5 min old.</text><line x1="627.0" y1="215" x2="652.0" y2="215" stroke="#3987e5" stroke-width="1.75" marker-end="url(#arr-b)"/><rect x="656.0" y="140" width="260" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><circle cx="686.0" cy="172" r="13" fill="#0d1117" stroke="#3987e5" stroke-width="1.5"/><text x="686.0" y="176.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">3</text><text x="710.0" y="177" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Record cash payment</text><text x="676.0" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">Only allowed while the</text><text x="676.0" y="239" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">check-in is valid</text><text x="676.0" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">(10 minutes).</text><line x1="919.0" y1="215" x2="944.0" y2="215" stroke="#3987e5" stroke-width="1.75" marker-end="url(#arr-b)"/><rect x="948.0" y="140" width="260" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><circle cx="978.0" cy="172" r="13" fill="#0d1117" stroke="#3987e5" stroke-width="1.5"/><text x="978.0" y="176.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">4</text><text x="1002.0" y="177" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">One transaction</text><text x="968.0" y="218" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">Order confirmed, payment</text><text x="968.0" y="239" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">saved and both events</text><text x="968.0" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">written to the outbox.</text><line x1="494.0" y1="292" x2="494.0" y2="336" stroke="#d03b3b" stroke-width="1.5" marker-end="url(#arr-r)" stroke-dasharray="4 4"/><rect x="364.0" y="340" width="260" height="64" rx="10" fill="#161b22" stroke="#d03b3b" stroke-width="1"/><text x="384.0" y="366" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Too far, stale or replayed</text><text x="384.0" y="388" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start">Rejected. No payment possible.</text><path d="M1078.0 292 V470 H336.0" fill="none" stroke="#3987e5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-b)"/><rect x="72.0" y="436" width="260" height="68" rx="34" fill="#1c2129" stroke="#d95926" stroke-width="1"/><text x="202.0" y="466" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="middle">sellora.order.v1</text><text x="202.0" y="488" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">OrderConfirmed + PaymentRecorded</text><path d="M202.0 506 V600 H448.0" fill="none" stroke="#d95926" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-o)"/><rect x="452.0" y="566" width="250" height="68" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="577.0" y="596.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Notification</text><text x="577.0" y="618.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">renders one receipt</text><path d="M202.0 506 V690 H448.0" fill="none" stroke="#d95926" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-o)" stroke-dasharray="5 5"/><rect x="452.0" y="660" width="250" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="577.0" y="686.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Audit log</text><text x="577.0" y="708.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">append-only, tamper-evident</text><path d="M702.0 600 C752.0 600 752.0 570 808.0 570" fill="none" stroke="#199e70" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-a)"/><rect x="812.0" y="540" width="300" height="60" rx="10" fill="#161b22" stroke="#199e70" stroke-width="1.5"/><text x="832.0" y="566" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Email to shop owner</text><text x="832.0" y="586" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">same record, same moment, with GPS</text><path d="M702.0 600 C752.0 600 752.0 650 808.0 650" fill="none" stroke="#199e70" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-a)"/><rect x="812.0" y="620" width="300" height="60" rx="10" fill="#161b22" stroke="#199e70" stroke-width="1.5"/><text x="832.0" y="646" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">Email to agency</text><text x="832.0" y="666" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8b949e" text-anchor="start">same record, same moment, with GPS</text></svg>