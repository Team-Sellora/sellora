<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Sellora business hierarchy"><title>Sellora business hierarchy</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#21262d"/></pattern><marker id="arr-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3987e5"/></marker><marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d95926"/></marker><marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#199e70"/></marker><marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d03b3b"/></marker></defs><rect width="1280" height="600" rx="16" fill="#0d1117"/><rect width="1280" height="600" rx="16" fill="url(#dots)"/><rect x="0.5" y="0.5" width="1279" height="599" rx="16" fill="none" stroke="#30363d"/><text x="64" y="70" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#e6edf3" text-anchor="start">The business hierarchy</text><text x="64" y="98" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8b949e" text-anchor="start">Every record belongs to one company. Five roles act at five levels.</text><rect x="62.0" y="150" width="184" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="154.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Company</text><text x="154.0" y="210.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">the tenant</text><line x1="154.0" y1="236" x2="154.0" y2="292" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="70.0" y="294" width="168" height="70" rx="35" fill="#1c2129" stroke="#30363d" stroke-width="1"/><text x="154.0" y="324" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Company Admin</text><text x="154.0" y="345" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">runs the whole tenant</text><line x1="250.0" y1="192" x2="299.0" y2="192" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-m)"/><text x="275.5" y="182" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">1 : N</text><rect x="305.0" y="150" width="184" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="397.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Province</text><text x="397.0" y="210.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">first-class entity</text><line x1="397.0" y1="236" x2="397.0" y2="292" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="313.0" y="294" width="168" height="70" rx="35" fill="#1c2129" stroke="#30363d" stroke-width="1"/><text x="397.0" y="324" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Area Manager</text><text x="397.0" y="345" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">can cover many provinces</text><line x1="493.0" y1="192" x2="542.0" y2="192" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-m)"/><text x="518.5" y="182" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">1 : N</text><rect x="548.0" y="150" width="184" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="640.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Agency</text><text x="640.0" y="210.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">local distributor</text><line x1="640.0" y1="236" x2="640.0" y2="292" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="556.0" y="294" width="168" height="70" rx="35" fill="#1c2129" stroke="#30363d" stroke-width="1"/><text x="640.0" y="324" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Agency Operator</text><text x="640.0" y="345" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">registers shops</text><line x1="736.0" y1="192" x2="785.0" y2="192" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-m)"/><text x="761.5" y="182" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">1 : N</text><rect x="791.0" y="150" width="184" height="84" rx="10" fill="#161b22" stroke="#3987e5" stroke-width="1.5"/><text x="883.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Territory</text><text x="883.0" y="210.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">exactly one rep</text><line x1="883.0" y1="236" x2="883.0" y2="292" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="799.0" y="294" width="168" height="70" rx="35" fill="#1c2129" stroke="#30363d" stroke-width="1"/><text x="883.0" y="324" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Sales Rep</text><text x="883.0" y="345" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">sells and collects cash</text><line x1="979.0" y1="192" x2="1028.0" y2="192" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr-m)"/><text x="1004.5" y="182" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">1 : N</text><rect x="1034.0" y="150" width="184" height="84" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="1126.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="middle">Shop</text><text x="1126.0" y="210.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">has GPS coordinates</text><line x1="1126.0" y1="236" x2="1126.0" y2="292" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="1042.0" y="294" width="168" height="70" rx="35" fill="#1c2129" stroke="#30363d" stroke-width="1"/><text x="1126.0" y="324" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Shop Owner</text><text x="1126.0" y="345" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">orders and confirms</text><text x="64" y="418" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="1.5">RULES THE SYSTEM ENFORCES</text><rect x="64.0" y="436" width="370.6666666666667" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="84.0" y="472" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">One rep per territory</text><text x="84.0" y="500" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">Territory to Sales Rep is strictly 1 : 1, so every</text><text x="84.0" y="521" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">sale has one owner.</text><rect x="454.6666666666667" y="436" width="370.6666666666667" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="474.6666666666667" y="472" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Shops come from agencies</text><text x="474.6666666666667" y="500" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">Only an agency registers shops, and only in</text><text x="474.6666666666667" y="521" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">territories it was given.</text><rect x="845.3333333333334" y="436" width="370.6666666666667" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="865.3333333333334" y="472" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start">Tenant comes from the token</text><text x="865.3333333333334" y="500" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">The company ID is read from the signed JWT,</text><text x="865.3333333333334" y="521" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e" text-anchor="start">never from the request.</text></svg>